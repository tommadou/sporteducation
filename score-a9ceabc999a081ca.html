<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>Season 26-27 — Score</title><style>
:root{--ink:#111;--muted:#777;--line:#dedede;--soft:#f5f5f2}
*{box-sizing:border-box}html{background:#fff}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}.app{max-width:820px;margin:auto;padding:28px 16px 70px}.hero{padding:8px 0 26px}.eyebrow{font-size:9px;letter-spacing:.31em;text-transform:uppercase;color:#888;margin-bottom:14px}
h1{margin:0;font-size:clamp(30px,9.2vw,68px);font-weight:400;line-height:.95;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.rule{border-top:1px solid #111;margin-top:28px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 18px}h2{margin:0;font-size:14px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}.meta{font-size:8px;color:#999;letter-spacing:.14em;text-transform:uppercase}
 .tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:#fff;padding:11px 0 10px;margin-right:22px;color:#999;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}.tab.active{color:#111;border-bottom:2px solid #111}.page-panel{display:none}.page-panel.active{display:block}
.table-wrap{overflow-x:auto}.standings{width:100%;border-collapse:collapse;min-width:520px}.standings th{font-size:8px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:#999;padding:9px 8px;border-bottom:0;text-align:right}.standings th:nth-child(1),.standings th:nth-child(2),.standings th:nth-child(3){text-align:left}.standings td{padding:17px 8px;border-bottom:0;text-align:right;font-size:13px}.standings td.pos{font-size:21px;text-align:left;width:48px;white-space:nowrap}.standings td.team{text-align:left;font-size:15px;letter-spacing:.06em;text-transform:uppercase}.standings td.total{font-size:20px;font-weight:500;text-align:right;min-width:54px}.standings tr.leader td.pos,.standings tr.leader td.team,.standings tr.leader td.total{font-weight:700}.medal{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:2px;box-shadow:0 0 0 1px rgba(0,0,0,.10)}.medal.gold{background:#c8a85a}.medal.silver{background:#bfc2c5}.medal.bronze{background:#a8734c}.class-note{display:block;font-size:8px;color:#999;letter-spacing:.12em;margin-top:4px}
.field{margin:0 0 18px}.field label{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#666;margin-bottom:8px}select,input{width:100%;min-height:48px;border:1px solid #ccc;border-radius:0;background:#fff;padding:12px;font-size:16px;color:#111}
.team-score{border-top:1px solid #111;padding:20px 0 24px}.team-score-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.team-score h3{margin:0;font-size:21px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}.teaching{font-size:8px;letter-spacing:.14em;border:1px solid #111;padding:6px 7px;text-transform:uppercase}
.criterion{margin:17px 0}.criterion-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px}.score-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score-btn{min-height:52px;border:1px solid #bbb;background:#fff;font-size:19px}.score-btn.selected{background:#111;color:#fff;border-color:#111}
.primary,.secondary{width:100%;min-height:50px;border:1px solid #111;padding:13px;text-transform:uppercase;letter-spacing:.15em;font-size:9px;margin-top:9px}.primary{background:#111;color:#fff}.secondary{background:#fff;color:#111}.primary:disabled{opacity:.35}
.notice{font-size:11px;line-height:1.55;background:var(--soft);padding:14px;margin:12px 0}.admin-row{border-top:1px solid #e4e4e4;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.admin-row strong{font-weight:400;letter-spacing:.04em}.admin-row small{display:block;color:#999;margin-top:4px}.actions{display:flex;gap:6px}.tiny{border:1px solid #bbb;background:#fff;padding:8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.recent{margin-top:42px;border-top:1px solid #111;padding-top:18px}.recent-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px}.recent-row{padding:14px 0;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.recent-row strong{display:block;font-size:12px;font-weight:400;letter-spacing:.04em}.recent-row small{display:block;font-size:9px;color:#888;line-height:1.5;margin-top:4px}.recent-points{font-size:18px;margin-right:8px}.recent-action{display:flex;align-items:center}.editor{border-top:1px solid #111;padding:18px 0;margin-top:10px}.editor-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}.hidden{display:none!important}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#111;color:#fff;padding:13px;z-index:50;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:560px){
.app{padding-top:24px}
.table-wrap{overflow-x:auto;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.standings{width:max-content;min-width:720px;table-layout:auto}
.standings th,.standings td{padding-left:8px;padding-right:8px}
.standings th:nth-child(1),.standings td.pos{width:48px;min-width:48px}
.standings th:nth-child(2),.standings td.team{width:190px;min-width:190px;max-width:190px}
.standings th:nth-child(3),.standings td.total{width:64px;min-width:64px;text-align:right}
.standings .detail-col{display:table-cell;min-width:100px}
.standings td.total{font-size:19px}
.score-buttons{gap:6px}.score-btn{min-height:50px}
}
@media(min-width:650px){.app{padding-left:22px;padding-right:22px}.score-buttons{max-width:420px}.toast{left:50%;right:auto;width:520px;transform:translateX(-50%)}}
</style></head><body><main class="app">
<header class="hero"><div class="eyebrow">VIVES · SPORT EDUCATION</div><h1>SEASON 26-27</h1><div class="rule"></div></header>
<div class="tabs" id="pageTabs"><button class="tab active" data-page="scorePanel">Scores invoeren</button><button class="tab" data-page="deletePanel">Scores verwijderen</button><button class="tab" data-page="leaderboardPanel">Leaderboard</button></div>
<section id="scorePanel" class="page-panel active">
<div class="section-head"><h2>Score invoeren</h2><span class="meta">Docenten</span></div>
<div class="field"><label>Docent</label><select id="teacher"></select></div><div class="field"><label>Klas</label><select id="class"></select></div><div class="field"><label>Les</label><select id="lesson"></select></div>
<div id="teams"></div><button id="save" class="primary" disabled>Alle scores opslaan</button>
</section>
<section id="deletePanel" class="page-panel">
<div class="section-head"><h2>Scores verwijderen</h2><span class="meta" id="recentTeacher">Kies docent</span></div>
<div class="notice" style="margin-bottom:16px">Toont de 10 laatst ingevoerde scores van de docent die je bij ‘Scores invoeren’ selecteert.</div>
<div id="recentScores"><div class="notice">Kies eerst een docent bij ‘Scores invoeren’.</div></div>
</section>
<section id="leaderboardPanel" class="page-panel">
<div class="section-head"><h2>Klassement</h2><span class="meta" id="updated">Live</span></div>
<div class="tabs" id="filters"></div><div class="table-wrap" id="ranking"><div class="notice">Klassement laden…</div></div>
</section>
</main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://lgwlvtsvsmxkyenesepj.supabase.co";
const SUPABASE_KEY="sb_publishable_2HHpT0z4esNRr4PmLX2W1g_6nH4LjgN";
const configured=!SUPABASE_URL.startsWith("YOUR_");
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("toast");if(!t)return;t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
</script><script>
let teams=[],lessons=[],criteria=[],teachers=[],lessonEvaluators=[],lessonCriteria=[],leaderboardScores=[],draft={},lbFilter="ALL";
async function load(){
 if(!configured)return toast("Koppel eerst Supabase");
 const [a,b,c,d,e,f,g]=await Promise.all([db.from("teams").select("*").eq("active",true).order("sort_order"),db.from("lessons").select("*").order("lesson_date"),db.from("criteria").select("*").eq("active",true).order("sort_order"),db.from("teachers").select("*").eq("active",true).order("name"),db.from("lesson_evaluators").select("*"),db.from("lesson_criteria").select("*"),db.from("scores").select("id,team_id,criterion_id,teacher_id,lesson_id,points,created_at")]);
 teams=a.data||[];lessons=b.data||[];criteria=c.data||[];teachers=d.data||[];lessonEvaluators=e.data||[];lessonCriteria=f.data||[];leaderboardScores=g.data||[];
 $("teacher").innerHTML='<option value="">Kies docent…</option>'+teachers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 const saved=localStorage.getItem("seasonTeacher");if(saved)$("teacher").value=saved;
 populateClasses();renderLeaderboard();loadRecentScores();
}
function assignedLessons(){
 const tid=$("teacher").value;
 const allowed=new Set(lessonEvaluators.filter(x=>String(x.teacher_id)===String(tid)).map(x=>String(x.lesson_id)));
 return lessons.filter(l=>tid&&allowed.has(String(l.id)));
}
function populateClasses(){
 const tid=$("teacher").value;
 const mine=assignedLessons();
 const classes=[...new Set(mine.map(l=>l.class_name))].sort();
 $("class").innerHTML='<option value="">'+(tid?(classes.length?"Kies een klas…":"Geen lessen toegewezen"):"Kies eerst docent…")+'</option>'+classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
 $("lesson").innerHTML='<option value="">Kies eerst klas…</option>';
 $("teams").innerHTML="";draft={};$("save").disabled=true;
}
function populateLessons(){
 const cls=$("class").value;
 const mine=assignedLessons().filter(l=>cls&&l.class_name===cls);
 $("lesson").innerHTML='<option value="">'+(cls?(mine.length?"Kies een les…":"Geen lessen voor deze klas"):"Kies eerst klas…")+'</option>'+mine.map(l=>`<option value="${l.id}">${new Date(l.lesson_date+"T12:00:00").toLocaleDateString("nl-BE")} · ${esc(l.title||"Les")}</option>`).join("");
 $("teams").innerHTML="";draft={};$("save").disabled=true;
}
$("teacher").onchange=()=>{localStorage.setItem("seasonTeacher",$("teacher").value);populateClasses();loadRecentScores()};
$("class").onchange=populateLessons;
$("lesson").onchange=render;
function render(){
 const l=lessons.find(x=>String(x.id)===$("lesson").value);draft={};$("save").disabled=true;if(!l){$("teams").innerHTML="";return}
 const allowedCriteria=new Set(lessonCriteria.filter(x=>String(x.lesson_id)===String(l.id)).map(x=>String(x.criterion_id)));
 $("teams").innerHTML=teams.filter(t=>t.class_name===l.class_name).map(t=>{const teaching=String(t.id)===String(l.teaching_team_id);const cs=criteria.filter(c=>allowedCriteria.has(String(c.id))&&(c.applies_to==="all"||(c.applies_to==="teaching"&&teaching)));return `<article class="team-score"><div class="team-score-head"><h3>${esc(t.name)}</h3>${teaching?'<span class="teaching">Gaf les</span>':""}</div>${cs.map(c=>`<div class="criterion"><div class="criterion-label">${esc(c.name)}</div><div class="score-buttons" style="grid-template-columns:repeat(${c.max_points-c.min_points+1},1fr)">${Array.from({length:c.max_points-c.min_points+1},(_,i)=>c.max_points-i).map(p=>`<button type="button" class="score-btn" data-t="${t.id}" data-c="${c.id}" data-p="${p}">${p}</button>`).join("")}</div></div>`).join("")}</article>`}).join("");
 document.querySelectorAll(".score-btn").forEach(b=>b.onclick=()=>{draft[b.dataset.t+"|"+b.dataset.c]=Number(b.dataset.p);b.parentElement.querySelectorAll(".score-btn").forEach(x=>x.classList.toggle("selected",x===b));validate()});
}
function validate(){const l=lessons.find(x=>String(x.id)===$("lesson").value);if(!l)return $("save").disabled=true;const allowedCriteria=new Set(lessonCriteria.filter(x=>String(x.lesson_id)===String(l.id)).map(x=>String(x.criterion_id)));let n=0;teams.filter(t=>t.class_name===l.class_name).forEach(t=>{const teach=String(t.id)===String(l.teaching_team_id);n+=criteria.filter(c=>allowedCriteria.has(String(c.id))&&(c.applies_to==="all"||(c.applies_to==="teaching"&&teach))).length});$("save").disabled=!$("teacher").value||Object.keys(draft).length!==n}
$("save").onclick=async()=>{const now=new Date().toISOString();const rows=Object.entries(draft).map(([k,points])=>{const [team_id,criterion_id]=k.split("|");return{lesson_id:Number($("lesson").value),team_id:Number(team_id),criterion_id:Number(criterion_id),teacher_id:Number($("teacher").value),points,created_at:now}});const {error}=await db.from("scores").upsert(rows,{onConflict:"lesson_id,team_id,criterion_id"});if(error)return toast(error.message);toast("Alle scores opgeslagen");draft={};await refreshScores();render()};

async function refreshScores(){
 const {data,error}=await db.from("scores").select("id,team_id,criterion_id,teacher_id,lesson_id,points,created_at");
 if(!error)leaderboardScores=data||[];
 renderLeaderboard();await loadRecentScores();
}
function renderLeaderboard(){
 if(!$("ranking"))return;
 const classes=["ALL",...[...new Set(teams.map(t=>t.class_name))].sort()];
 $("filters").innerHTML=classes.map(c=>`<button class="tab ${lbFilter===c?"active":""}" data-c="${esc(c)}">${c==="ALL"?"Overall":esc(c)}</button>`).join("");
 $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{lbFilter=b.dataset.c;renderLeaderboard()});
 const sums={};teams.forEach(t=>sums[t.id]={total:0,by:{}});
 leaderboardScores.forEach(s=>{if(!sums[s.team_id])return;const p=Number(s.points||0);sums[s.team_id].total+=p;sums[s.team_id].by[s.criterion_id]=(sums[s.team_id].by[s.criterion_id]||0)+p});
 const rows=teams.filter(t=>lbFilter==="ALL"||t.class_name===lbFilter).sort((a,b)=>sums[b.id].total-sums[a.id].total||a.name.localeCompare(b.name));
 const headers=criteria.map(c=>`<th class="detail-col">${esc(c.short_name||c.name)}</th>`).join("");
 const medal=i=>i===0?'<span class="medal gold" title="1e plaats"></span>':i===1?'<span class="medal silver" title="2e plaats"></span>':i===2?'<span class="medal bronze" title="3e plaats"></span>':"";
 const body=rows.map((t,i)=>`<tr class="${i===0?"leader":""}"><td class="pos">${i+1}${medal(i)}</td><td class="team">${esc(t.name)}${lbFilter==="ALL"?`<span class="class-note">${esc(t.class_name)}</span>`:""}</td><td class="total">${sums[t.id].total}</td>${criteria.map(c=>`<td class="detail-col">${sums[t.id].by[c.id]||0}</td>`).join("")}</tr>`).join("");
 $("ranking").innerHTML=`<table class="standings"><thead><tr><th>#</th><th>Team</th><th>Pts</th>${headers}</tr></thead><tbody>${body}</tbody></table>`;
 $("updated").textContent="LIVE · "+new Date().toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
}
async function loadRecentScores(){
 const tid=$("teacher")?.value;
 const box=$("recentScores"),meta=$("recentTeacher");
 if(!box)return;
 if(!tid){box.innerHTML='<div class="notice">Kies eerst een docent bij ‘Scores invoeren’.</div>';if(meta)meta.textContent="Kies docent";return}
 const teacher=teachers.find(t=>String(t.id)===String(tid));if(meta)meta.textContent=teacher?.name||"Docent";
 const {data,error}=await db.from("scores").select("id,lesson_id,team_id,criterion_id,teacher_id,points,created_at").eq("teacher_id",tid).order("created_at",{ascending:false}).limit(10);
 if(error){box.innerHTML=`<div class="notice">${esc(error.message)}</div>`;return}
 if(!data?.length){box.innerHTML='<div class="notice">Nog geen scores ingevoerd door deze docent.</div>';return}
 box.innerHTML=data.map(s=>{const l=lessons.find(x=>String(x.id)===String(s.lesson_id));const t=teams.find(x=>String(x.id)===String(s.team_id));const c=criteria.find(x=>String(x.id)===String(s.criterion_id));const when=s.created_at?new Date(s.created_at).toLocaleString("nl-BE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";return `<div class="recent-row"><div><strong>${esc(t?.name||"Team")} · ${esc(c?.name||"Criterium")}</strong><small>${esc(l?.class_name||t?.class_name||"")} · ${l?new Date(l.lesson_date+"T12:00:00").toLocaleDateString("nl-BE"):""} · ${esc(l?.title||"Les")} · ${esc(when)}</small></div><div class="recent-action"><span class="recent-points">${s.points}</span><button type="button" class="tiny delete-recent" data-id="${s.id}">Verwijder</button></div></div>`}).join("");
 box.querySelectorAll(".delete-recent").forEach(b=>b.onclick=()=>deleteRecentScore(b.dataset.id));
}
async function deleteRecentScore(id){
 if(!confirm("Deze score verwijderen?"))return;
 const tid=$("teacher").value;
 const {error}=await db.from("scores").delete().eq("id",id).eq("teacher_id",tid);
 if(error)return toast(error.message);
 toast("Score verwijderd");await refreshScores();
}
$("pageTabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{$("pageTabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".page-panel").forEach(p=>p.classList.toggle("active",p.id===b.dataset.page));if(b.dataset.page==="leaderboardPanel")renderLeaderboard();if(b.dataset.page==="deletePanel")loadRecentScores()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshScores()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
load();
</script></body></html>

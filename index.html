.criterion{margin:17px 0}.criterion-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px}.score-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score-btn{min-height:52px;border:1px solid #bbb;background:#fff;font-size:19px}.score-btn.selected{background:#111;color:#fff;border-color:#111}
.primary,.secondary{width:100%;min-height:50px;border:1px solid #111;padding:13px;text-transform:uppercase;letter-spacing:.15em;font-size:9px;margin-top:9px}.primary{background:#111;color:#fff}.secondary{background:#fff;color:#111}.primary:disabled{opacity:.35}
.notice{font-size:11px;line-height:1.55;background:var(--soft);padding:14px;margin:12px 0}.admin-row{border-top:1px solid #e4e4e4;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.admin-row strong{font-weight:400;letter-spacing:.04em}.admin-row small{display:block;color:#999;margin-top:4px}.actions{display:flex;gap:6px}.tiny{border:1px solid #bbb;background:#fff;padding:8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.editor{border-top:1px solid #111;padding:18px 0;margin-top:10px}.editor-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}.hidden{display:none!important}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#111;color:#fff;padding:13px;z-index:50;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}

.app{padding-top:24px}
.table-wrap{overflow-x:auto;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.standings{width:max-content;min-width:720px;table-layout:auto}
.standings th,.standings td{padding-left:8px;padding-right:8px}
.standings th:nth-child(1),.standings td.pos{width:48px;min-width:48px}
.standings th:nth-child(2),.standings td.team{width:190px;min-width:190px;max-width:190px}
.standings th:nth-child(3),.standings td.total{width:64px;min-width:64px;text-align:right}
.standings .detail-col{display:table-cell;min-width:100px}

}

.nav-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}

</style></head><body><main class="app">
<header class="hero"><div class="eyebrow">VIVES · SPORT EDUCATION</div><h1>SEASON 26-27</h1><div class="nav-links"><a class="nav-link" href="reglement.html">Wedstrijdreglement</a></div><div class="rule"></div></header>
<div class="section-head"><h2>Klassement</h2><span class="meta" id="updated">Live</span></div>
<div class="tabs" id="filters"></div><div class="table-wrap" id="ranking"><div class="notice">Klassement laden…</div></div>
</main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://lgwlvtsvsmxkyenesepj.supabase.co";
const SUPABASE_KEY="sb_publishable_2HHpT0z4esNRr4PmLX2W1g_6nH4LjgN";
const configured=!SUPABASE_URL.startsWith("YOUR_");
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("toast");if(!t)return;t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
</script><script>
let teams=[],criteria=[],scores=[],filter="ALL";
async function load(){
 if(!configured){$("ranking").innerHTML='<div class="notice">Koppel eerst Supabase. Zie README.md.</div>';return}
 const [a,b,c]=await Promise.all([db.from("teams").select("*").eq("active",true).order("sort_order"),db.from("criteria").select("*").eq("active",true).order("sort_order"),db.from("scores").select("team_id,criterion_id,points,created_at")]);
 teams=a.data||[];criteria=b.data||[];scores=c.data||[];render();
}
function render(){
 const classes=["ALL",...[...new Set(teams.map(t=>t.class_name))].sort()];
 $("filters").innerHTML=classes.map(c=>`<button class="tab ${filter===c?"active":""}" data-c="${esc(c)}">${c==="ALL"?"Overall":esc(c)}</button>`).join("");
 $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.c;render()});
 const sums={};teams.forEach(t=>sums[t.id]={total:0,by:{}});
 scores.forEach(s=>{if(!sums[s.team_id])return;const p=Number(s.points||0);sums[s.team_id].total+=p;sums[s.team_id].by[s.criterion_id]=(sums[s.team_id].by[s.criterion_id]||0)+p});
 const rows=teams.filter(t=>filter==="ALL"||t.class_name===filter).sort((a,b)=>sums[b.id].total-sums[a.id].total||a.name.localeCompare(b.name));
 const headers=criteria.map(c=>`<th class="detail-col">${esc(c.short_name||c.name)}</th>`).join("");
 const medal=i=>i===0?'<span class="medal gold" title="1e plaats"></span>':i===1?'<span class="medal silver" title="2e plaats"></span>':i===2?'<span class="medal bronze" title="3e plaats"></span>':"";
 const body=rows.map((t,i)=>`<tr class="${i===0?"leader":""}"><td class="pos">${i+1}${medal(i)}</td><td class="team">${esc(t.name)}${filter==="ALL"?`<span class="class-note">${esc(t.class_name)}</span>`:""}</td><td class="total">${sums[t.id].total}</td>${criteria.map(c=>`<td class="detail-col">${sums[t.id].by[c.id]||0}</td>`).join("")}</tr>`).join("");
 $("ranking").innerHTML=`<table class="standings"><thead><tr><th>#</th><th>Team</th><th>Pts</th>${headers}</tr></thead><tbody>${body}</tbody></table>`;
 $("updated").textContent="LIVE · "+new Date().toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
}
load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
